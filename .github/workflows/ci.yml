name: CI

on:
  push:
    branches: [dev, main]
    paths-ignore: ['**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Use isolated database and model cache
        run: |
          echo "NOVEL_DB_FILE=$RUNNER_TEMP/plotforge-ci.db" >> "$GITHUB_ENV"
          echo "NOVEL_EMBED_CACHE_DIR=$RUNNER_TEMP/plotforge-model-cache" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit all dependencies
        run: npm audit --registry=https://registry.npmjs.org
      - name: Audit production dependencies
        run: npm audit --omit=dev --registry=https://registry.npmjs.org
      - name: Check frontend
        run: npx biome check frontend
      - name: Build frontend
        run: npm run build
      - name: Test backend
        run: npm test
      - name: Test frontend
        run: npm run test:fe -- --no-file-parallelism
      - name: Verify native embedding on Linux
        env:
          HF_ENDPOINT: https://huggingface.co
          NOVEL_DB_FILE: ${{ runner.temp }}/plotforge-embedding-online.db
        run: node tools/verify-embedding-runtime.js --output "$RUNNER_TEMP/embedding-online.json"
      - name: Verify embedding from offline cache
        env:
          HF_ENDPOINT: https://huggingface.co
          NOVEL_DB_FILE: ${{ runner.temp }}/plotforge-embedding-offline.db
        run: node tools/verify-embedding-runtime.js --offline --output "$RUNNER_TEMP/embedding-offline.json"
