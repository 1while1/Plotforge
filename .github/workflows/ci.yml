name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Use isolated database
        run: echo "NOVEL_DB_FILE=$RUNNER_TEMP/plotforge-ci.db" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check frontend
        run: npx biome check frontend
      - name: Build frontend
        run: npm run build
      - name: Test backend
        run: npm test
      - name: Test frontend
        run: npm run test:fe -- --no-file-parallelism
